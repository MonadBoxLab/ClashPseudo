name: 更新依赖并发布

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'patch：维护更新；minor：新增功能；major：稳定版的不兼容更改；stable：首次发布稳定版'
        type: choice
        options: [patch, minor, major, stable]
        default: patch
      publish_current:
        description: '即使没有新的依赖版本，也为当前应用准备新版本并发布'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dependency-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATIC_RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      GOTOOLCHAIN: local
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
      CLASH_AUTOMATIC_RELEASES_ENABLED: ${{ github.event_name == 'workflow_dispatch' && 'true' || vars.AUTOMATIC_RELEASES_ENABLED }}
      CLASH_REQUIRE_DISTRIBUTION_SIGNING: 'true'
      CLASH_PSEUDO_ANDROID_KEYSTORE_BASE64: ${{ secrets.CLASH_PSEUDO_ANDROID_KEYSTORE_BASE64 }}
      CLASH_PSEUDO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CLASH_PSEUDO_ANDROID_KEYSTORE_PASSWORD }}
      CLASH_PSEUDO_ANDROID_KEY_ALIAS: ${{ secrets.CLASH_PSEUDO_ANDROID_KEY_ALIAS }}
      CLASH_PSEUDO_ANDROID_KEY_PASSWORD: ${{ secrets.CLASH_PSEUDO_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !env.ACT && env.CLASH_LOCAL_EXECUTION != 'true' }}
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: 核对容器 workspace 与固定输入
        if: ${{ env.ACT || env.CLASH_LOCAL_EXECUTION == 'true' }}
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          test -f native/mihomo/go.mod
          test -f pubspec.yaml
          python3 -I -B tool/dependencies/release.py --verify-local-input --output "$RUNNER_TEMP/clash-release"
      - name: 准备本地固定工具链
        if: ${{ env.ACT || env.CLASH_LOCAL_EXECUTION == 'true' }}
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 -I -B tool/dependencies/toolchains.py --environment "$RUNNER_TEMP/clash-toolchain-environment.json"
      - name: 在本地运行交付工具测试
        if: ${{ env.ACT || env.CLASH_LOCAL_EXECUTION == 'true' }}
        shell: bash
        run: |
          python3 -I -B -m unittest discover -s test/tool -v
          node --test test/tool/dependency_release_action.test.cjs
      - name: 准备本地分发材料
        if: ${{ env.ACT || env.CLASH_LOCAL_EXECUTION == 'true' }}
        id: local_release
        shell: bash
        run: |
          python3 -I -B tool/dependencies/release.py --local --output "$RUNNER_TEMP/clash-release"
      - name: 准备依赖更新与分发材料
        if: ${{ !env.ACT && env.CLASH_LOCAL_EXECUTION != 'true' }}
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION_BUMP: ${{ inputs.version_bump || 'patch' }}
          INPUT_PUBLISH_CURRENT: ${{ inputs.publish_current }}
        shell: bash
        run: |
          arguments=(--output "$RUNNER_TEMP/clash-release" --bump "$INPUT_VERSION_BUMP")
          if [[ "$INPUT_PUBLISH_CURRENT" == true ]]; then arguments+=(--publish-current); fi
          cp .github/scripts/publish-release.cjs "$RUNNER_TEMP/clash-publish-release.cjs"
          python3 -I tool/dependencies/release.py "${arguments[@]}"
      - name: 通过GitHub Actions发布
        if: ${{ success() && !env.ACT && env.CLASH_LOCAL_EXECUTION != 'true' && steps.release.outputs.plan != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_PLAN: ${{ steps.release.outputs.plan }}
        with:
          script: |
            const path = require('node:path');
            const publish = require(path.join(process.env.RUNNER_TEMP, 'clash-publish-release.cjs'));
            await publish({ github, context, core });
      - name: 保存本地发布材料与诊断输出
        if: ${{ always() && (env.ACT || env.CLASH_LOCAL_EXECUTION == 'true') }}
        shell: bash
        run: |
          if [[ -d "$RUNNER_TEMP/clash-release" ]]; then
            output="$GITHUB_WORKSPACE/.local/release-materials"
            mkdir "$output"
            cp -a "$RUNNER_TEMP/clash-release/." "$output/"
          fi
      - name: 保存发布材料与诊断输出
        if: ${{ always() && !env.ACT && env.CLASH_LOCAL_EXECUTION != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-materials-${{ steps.release.outputs.version || steps.local_release.outputs.version || 'preparation' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/clash-release
          if-no-files-found: ignore
