name: Update dependencies and release

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      mihomo_tag:
        description: '目标 mihomo 正式 tag；留空使用最新正式版'
        type: string
        default: ''
      version_bump:
        description: 'patch：维护；minor：功能；major：稳定期不兼容；stable：明确首次稳定发布'
        type: choice
        options: [patch, minor, major, stable]
        default: patch
      publish_current:
        description: '同时发布当前尚未确定新版本的应用交付'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dependency-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: vars.AUTOMATIC_RELEASES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      FLUTTER_VERSION: '3.47.8'
      ANDROID_BUILD_TOOLS: '36.0.0'
      GOTOOLCHAIN: local
      GH_TOKEN: ${{ github.token }}
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
      CLASH_AUTOMATIC_RELEASES_ENABLED: ${{ vars.AUTOMATIC_RELEASES_ENABLED }}
      CLASH_REQUIRE_DISTRIBUTION_SIGNING: 'true'
      CLASH_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      CLASH_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      CLASH_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/mihomo/go.mod
          cache-dependency-path: native/mihomo/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
      - name: Prepare Android build tools
        shell: bash
        run: |
          sdkmanager "build-tools;$ANDROID_BUILD_TOOLS"
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 -I - <<'PY'
          import base64
          import os
          from pathlib import Path
          import tempfile
          required = ('ANDROID_KEYSTORE_BASE64', 'CLASH_SIGNING_STORE_PASSWORD',
                      'CLASH_SIGNING_KEY_ALIAS', 'CLASH_SIGNING_KEY_PASSWORD')
          if not all(os.environ.get(name) for name in required):
              raise SystemExit('Android distribution signing Secrets are incomplete')
          descriptor, name = tempfile.mkstemp(prefix='clash-signing-', suffix='.jks', dir=os.environ['RUNNER_TEMP'])
          with os.fdopen(descriptor, 'wb') as stream:
              stream.write(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write('CLASH_SIGNING_STORE_FILE=' + name + '\n')
          PY
      - name: Prepare update and verified distribution materials
        id: release
        env:
          INPUT_MIHOMO_TAG: ${{ inputs.mihomo_tag }}
          INPUT_VERSION_BUMP: ${{ inputs.version_bump || 'patch' }}
          INPUT_PUBLISH_CURRENT: ${{ inputs.publish_current }}
        shell: bash
        run: |
          arguments=(--output "$RUNNER_TEMP/clash-release" --bump "$INPUT_VERSION_BUMP")
          if [[ -n "$INPUT_MIHOMO_TAG" ]]; then arguments+=(--mihomo-tag "$INPUT_MIHOMO_TAG"); fi
          if [[ "$INPUT_PUBLISH_CURRENT" == true ]]; then arguments+=(--publish-current); fi
          cp .github/scripts/publish-release.cjs "$RUNNER_TEMP/clash-publish-release.cjs"
          python3 -I tool/dependencies/release.py "${arguments[@]}"
      - name: Publish through GitHub Actions
        if: success() && steps.release.outputs.plan != ''
        uses: actions/github-script@v7
        env:
          RELEASE_PLAN: ${{ steps.release.outputs.plan }}
        with:
          script: |
            const path = require('node:path');
            const publish = require(path.join(process.env.RUNNER_TEMP, 'clash-publish-release.cjs'));
            await publish({ github, context, core });
      - name: Preserve release materials and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-materials-${{ steps.release.outputs.version || 'preparation' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/clash-release
          if-no-files-found: ignore
      - name: Remove temporary signing key
        if: always()
        run: |
          python3 -I - <<'PY'
          import os
          from pathlib import Path
          name = os.environ.get('CLASH_SIGNING_STORE_FILE')
          if name:
              path = Path(name)
              if path.parent == Path(os.environ['RUNNER_TEMP']) and path.name.startswith('clash-signing-'):
                  path.unlink(missing_ok=True)
          PY
