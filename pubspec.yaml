name: clash_pseudo
description: "Clash Pseudo, a cross-platform network routing app by MonadBox Lab."
publish_to: 'none'
version: 0.1.0+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  flutter_svg: 2.3.0
  vector_graphics_compiler: 1.3.2
  file_selector: 1.1.0
  re_editor:
    path: third_party/sources/re_editor
  yaml_edit: 2.2.4
  yaml: 3.1.4

dev_dependencies:
  coverage: 1.16.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - LICENSE
    - third_party/notices/mihomo.txt
    - third_party/notices/go.txt
    - third_party/notices/android.txt
    - third_party/notices/material-icons.txt
    - third_party/sources/re_editor/LICENSE
    - third_party/data/certificates/NOTICE.txt
    - third_party/data/certificates/MPL-2.0.txt
    - third_party/notices/publicsuffix.txt
    - third_party/data/geodata/NOTICE.txt
    - third_party/data/geodata/CC-BY-SA-4.0.txt
    - third_party/data/geodata/GeoSite-MIT.txt
    - third_party/data/geodata/CC-BY-4.0.txt
