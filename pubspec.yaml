name: clash_pseudo
description: "Clash Pseudo, a cross-platform network routing app by MonadBox Lab."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: 2.3.0
  vector_graphics_compiler: 1.3.2
  file_selector: 1.1.0
  re_editor: 0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - LICENSE
    - third_party/mihomo/LICENSE
    - third_party/go-notices.txt
    - third_party/android-notices.txt
    - third_party/material-icons-notice.txt
